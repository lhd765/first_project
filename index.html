<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臭乐乐 ♥</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0614; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 28px;
    text-align: center; color: rgba(255, 255, 255, .45);
    font: 14px/1 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    letter-spacing: .2em; pointer-events: none; transition: opacity .8s;
  }
  .hint.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">点一下屏幕试试</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, DPR, S, CX, CY;
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);

  // 心形参数曲线（单位坐标，y 向上）
  const hp = t => [
    16 * Math.pow(Math.sin(t), 3),
    13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
  ];
  const Y_OFF = 2.8; // 让心形的包围盒中心落在画面中心

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W * 0.66 / 32, H * 0.56 / 29);
    CX = W / 2; CY = H / 2;
  }
  addEventListener('resize', resize);
  resize();

  // 心形路径（以 (x,y) 为中心，scale 为缩放）
  function heartPath(x, y, s) {
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const [hx, hy] = hp(i / 120 * TAU);
      const px = x + hx * s, py = y - (hy + Y_OFF) * s;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  // ---------- 鼠标视差 ----------
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  addEventListener('pointermove', e => {
    mouse.tx = (e.clientX / W - 0.5) * 2;
    mouse.ty = (e.clientY / H - 0.5) * 2;
  });

  // ---------- 背景光斑 ----------
  const blobs = [
    { c: '255,61,127', r: .55, sp: .00011, ph: 0 },
    { c: '124,58,237', r: .6, sp: .00008, ph: 2 },
    { c: '34,211,238', r: .4, sp: .00013, ph: 4 },
    { c: '255,154,98', r: .35, sp: .00010, ph: 5.5 },
  ];

  // ---------- 粒子：沿心形边缘涌出 ----------
  const N = reduce ? 300 : 1100;
  const parts = Array.from({ length: N }, () => newPart(true));
  function newPart(first) {
    return {
      t: rand(0, TAU),
      life: first ? Math.random() : 0,
      speed: rand(.18, .5),
      push: rand(.25, .9),
      swirl: rand(-.25, .25),
      size: rand(.6, 2.2),
      hue: rand(315, 360) + (Math.random() < .25 ? rand(-90, -40) : 0)
    };
  }

  // ---------- 漂浮小爱心 ----------
  const floaters = Array.from({ length: reduce ? 6 : 18 }, () => newFloater(true));
  function newFloater(first) {
    return {
      x: rand(0, 1), y: first ? rand(0, 1) : 1.1,
      s: rand(.18, .6), v: rand(.015, .045),
      ph: rand(0, TAU), a: rand(.12, .38),
      h: rand(320, 360)
    };
  }

  // ---------- 点击爆发 ----------
  const bursts = [];
  function burst(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TAU), v = rand(60, 260);
      bursts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: 1, s: rand(.25, .75), h: rand(320, 360), rot: rand(-1, 1)
      });
    }
    pulseBoost = 1;
    hint.classList.add('off');
  }
  addEventListener('pointerdown', e => burst(e.clientX, e.clientY));

  // ---------- 心跳 ----------
  const PERIOD = 1.5;
  let rings = [], lastCycle = -1, pulseBoost = 0;
  const beat = p =>
    .62 * Math.exp(-Math.pow((p - .10) * 13, 2)) +
    .38 * Math.exp(-Math.pow((p - .30) * 13, 2));

  // ---------- 主循环 ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    const time = now / 1000;

    mouse.x += (mouse.tx - mouse.x) * .06;
    mouse.y += (mouse.ty - mouse.y) * .06;

    const cycle = Math.floor(time / PERIOD);
    const p = (time % PERIOD) / PERIOD;
    if (cycle !== lastCycle) { lastCycle = cycle; rings.push({ r: 1, a: .7 }); }
    pulseBoost *= Math.pow(.02, dt);
    const b = beat(p) * (reduce ? .3 : 1) + pulseBoost * .6;
    const scale = 1 + .075 * b + .012 * Math.sin(time * 1.7);

    const cx = CX + mouse.x * 14, cy = CY + mouse.y * 10 + Math.sin(time * 1.1) * 4;
    const s = S * scale;

    // 背景
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0b0614';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const bl of blobs) {
      const a = time * 1000 * bl.sp * 6 + bl.ph;
      const x = W / 2 + Math.cos(a) * W * .28 - mouse.x * 20;
      const y = H / 2 + Math.sin(a * 1.3) * H * .22 - mouse.y * 14;
      const r = Math.max(W, H) * bl.r;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${bl.c},${.20 + b * .06})`);
      g.addColorStop(1, `rgba(${bl.c},0)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // 漂浮小爱心
    for (const f of floaters) {
      f.y -= f.v * dt;
      if (f.y < -.1) Object.assign(f, newFloater(false));
      const x = f.x * W + Math.sin(time * .8 + f.ph) * 22;
      ctx.fillStyle = `hsla(${f.h},90%,70%,${f.a * Math.min(1, f.y * 3)})`;
      heartPath(x, f.y * H, f.s * 1.1);
      ctx.fill();
    }

    // 心形外发光
    {
      const r = s * 26;
      const g = ctx.createRadialGradient(cx, cy, s * 4, cx, cy, r);
      g.addColorStop(0, `rgba(255,70,140,${.38 + b * .25})`);
      g.addColorStop(.5, `rgba(168,60,230,${.14 + b * .1})`);
      g.addColorStop(1, 'rgba(120,60,240,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }

    // 扩散光环（每次心跳一圈）
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.r += dt * .55; rg.a -= dt * .5;
      if (rg.a <= 0) { rings.splice(i, 1); continue; }
      ctx.lineWidth = 2;
      ctx.strokeStyle = `rgba(255,120,190,${rg.a * .6})`;
      heartPath(cx, cy, s * rg.r);
      ctx.stroke();
    }

    // 粒子
    for (const q of parts) {
      q.life += dt * q.speed * .55;
      q.t += dt * q.swirl * .35;
      if (q.life >= 1) Object.assign(q, newPart(false));
      const [hx, hy] = hp(q.t);
      const k = 1 + q.life * q.push * (.9 + b * .5) + .02;
      const x = cx + hx * s * k;
      const y = cy - (hy + Y_OFF) * s * k;
      const al = Math.sin(q.life * Math.PI) * .85;
      ctx.fillStyle = `hsla(${q.hue},100%,68%,${al})`;
      ctx.beginPath();
      ctx.arc(x, y, q.size * (1 - q.life * .5), 0, TAU);
      ctx.fill();
    }

    // 心形主体
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.shadowColor = 'rgba(255,50,130,.75)';
    ctx.shadowBlur = 40 + b * 40;
    const ang = time * .35;
    const gx = Math.cos(ang) * s * 18, gy = Math.sin(ang) * s * 18;
    const body = ctx.createLinearGradient(cx - gx, cy - gy, cx + gx, cy + gy);
    body.addColorStop(0, '#ff9a62');
    body.addColorStop(.32, '#ff3d7f');
    body.addColorStop(.68, '#c026d3');
    body.addColorStop(1, '#5b21d6');
    ctx.fillStyle = body;
    heartPath(cx, cy, s);
    ctx.fill();
    ctx.restore();

    // 玻璃质感：内部高光与暗角
    ctx.save();
    heartPath(cx, cy, s);
    ctx.clip();

    const hl = ctx.createRadialGradient(cx - s * 8, cy - s * 9, 0, cx - s * 8, cy - s * 9, s * 14);
    hl.addColorStop(0, 'rgba(255,255,255,.55)');
    hl.addColorStop(.45, 'rgba(255,255,255,.12)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(cx - s * 20, cy - s * 20, s * 40, s * 40);

    const sh = ctx.createRadialGradient(cx, cy + s * 4, s * 6, cx, cy + s * 4, s * 20);
    sh.addColorStop(0, 'rgba(20,0,60,0)');
    sh.addColorStop(1, 'rgba(20,0,60,.45)');
    ctx.fillStyle = sh;
    ctx.fillRect(cx - s * 20, cy - s * 20, s * 40, s * 40);

    // 一道缓慢扫过的光
    const sweep = ((time * .22) % 1.6 - .3) * s * 44 - s * 22;
    const sg = ctx.createLinearGradient(cx + sweep - s * 5, cy - s * 8, cx + sweep + s * 5, cy + s * 8);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(.5, 'rgba(255,255,255,.16)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(cx - s * 20, cy - s * 20, s * 40, s * 40);
    ctx.restore();

    // 边缘描边
    const rim = ctx.createLinearGradient(cx - s * 16, cy - s * 14, cx + s * 16, cy + s * 14);
    rim.addColorStop(0, 'rgba(255,255,255,.85)');
    rim.addColorStop(.5, 'rgba(255,200,230,.25)');
    rim.addColorStop(1, 'rgba(255,255,255,.55)');
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = rim;
    heartPath(cx, cy, s);
    ctx.stroke();

    // 文字：臭乐乐
    {
      const fs = s * 6.6;
      const gap = fs * .14;
      const chars = '臭乐乐'.split('');
      ctx.font = `800 ${fs}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const widths = chars.map(c => ctx.measureText(c).width);
      const total = widths.reduce((a, c) => a + c, 0) + gap * (chars.length - 1);
      let x = cx - total / 2;
      const y = cy - s * 3.3;

      ctx.save();
      ctx.shadowColor = 'rgba(90,0,70,.55)';
      ctx.shadowBlur = fs * .35;
      ctx.shadowOffsetY = fs * .06;
      const tg = ctx.createLinearGradient(0, y - fs / 2, 0, y + fs / 2);
      tg.addColorStop(0, '#ffffff');
      tg.addColorStop(1, '#ffe0ee');
      ctx.fillStyle = tg;
      chars.forEach((c, i) => {
        // 每个字错开一点点，轻轻起伏
        const wob = Math.sin(time * 2.2 - i * .7) * fs * .035;
        ctx.fillText(c, x, y + wob);
        x += widths[i] + gap;
      });
      ctx.restore();
    }

    // 点击爆发的小爱心
    ctx.globalCompositeOperation = 'lighter';
    for (let i = bursts.length - 1; i >= 0; i--) {
      const u = bursts[i];
      u.life -= dt * .9;
      if (u.life <= 0) { bursts.splice(i, 1); continue; }
      u.vy += 220 * dt;
      u.x += u.vx * dt; u.y += u.vy * dt;
      u.vx *= Math.pow(.4, dt);
      ctx.fillStyle = `hsla(${u.h},100%,70%,${u.life * .9})`;
      heartPath(u.x, u.y, u.s * (.6 + u.life * .6));
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
